<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Feedback Quality Evaluator data and reasoning flow</title>
<desc id="desc">Task goal, rubric, learner work, issue evidence, and feedback text flow through transparent dimension checks, not-evaluable gates, review flags, and human-validation comparisons.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52656D"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Feedback Quality Evaluator · data and reasoning flow</text>
<text x="60" y="98" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">Context controls what the evaluator is allowed to claim.</text>

<rect x="55" y="145" width="250" height="145" rx="18" fill="#E8F1F3" stroke="#87949A" stroke-width="2"/>
<text x="180" y="178" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Structured context</text>
<text x="180" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">goal · rubric · standard</text>
<text x="180" y="226" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">learner work · identified issue</text>
<text x="180" y="247" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">supporting / reference evidence</text>

<line x1="310" y1="217" x2="360" y2="217" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="375" y="145" width="220" height="145" rx="18" fill="#EEF3E8" stroke="#87949A" stroke-width="2"/>
<text x="485" y="178" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Dimension checks</text>
<text x="485" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">lexical/context overlap</text>
<text x="485" y="226" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">actions · rationale · next step</text>
<text x="485" y="247" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">framing · agency cues</text>

<line x1="600" y1="217" x2="650" y2="217" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="665" y="125" width="220" height="185" rx="18" fill="#F5EDE4" stroke="#87949A" stroke-width="2"/>
<text x="775" y="158" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Evidence boundary</text>
<text x="775" y="187" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">missing context?</text>
<text x="775" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">→ not_evaluable</text>
<text x="775" y="235" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">reference verdict absent?</text>
<text x="775" y="256" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">→ no correctness claim</text>
<text x="775" y="282" text-anchor="middle" font-family="Arial" font-size="12" fill="#5B6660">no hidden total score</text>

<line x1="890" y1="217" x2="940" y2="217" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="955" y="145" width="200" height="145" rx="18" fill="#ECE8F5" stroke="#87949A" stroke-width="2"/>
<text x="1055" y="178" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Review output</text>
<text x="1055" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">dimension records</text>
<text x="1055" y="226" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">flags + suggestions</text>
<text x="1055" y="247" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">human agreement metrics</text>

<rect x="55" y="350" width="1100" height="70" rx="16" fill="#FFF7EC" stroke="#D4B27C"/>
<text x="75" y="378" font-family="Arial" font-size="15" font-weight="700" fill="#6F5427">Interpretation boundary</text>
<text x="75" y="402" font-family="Arial" font-size="14" fill="#6F5427">A lexical match is not semantic proof. A scored dimension is a transparent heuristic signal that still requires empirical validation.</text>
</svg>