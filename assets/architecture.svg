<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Feedback Quality Evaluator architecture</title>
<desc id="desc">Structured task and learner-work context plus feedback text are evaluated across separate transparent dimensions, then converted into review flags and human-validation evidence.</desc>
<rect width="1200" height="340" rx="24" fill="#f7f8fa"/>
<text x="50" y="48" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17202a">Feedback Quality Evaluator · context-aware architecture</text>
<text x="50" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#59636e">Distinct feedback properties stay separate; the main API does not collapse them into one quality score.</text>

<rect x="40" y="125" width="210" height="120" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="145" y="154" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Task context</text>
<text x="145" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">goal · rubric · standard</text>
<text x="145" y="198" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">learner work · issue</text>
<text x="145" y="218" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">reference evidence</text>

<line x1="258" y1="185" x2="292" y2="185" stroke="#8391a1" stroke-width="2"/>
<path d="M284 179 L292 185 L284 191" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="300" y="125" width="190" height="120" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="395" y="154" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Feedback text</text>
<text x="395" y="180" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">wording + actions</text>
<text x="395" y="200" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">rationale + next step</text>
<text x="395" y="220" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">agency cues</text>

<line x1="498" y1="185" x2="532" y2="185" stroke="#8391a1" stroke-width="2"/>
<path d="M524 179 L532 185 L524 191" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="540" y="105" width="230" height="160" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="655" y="137" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Separate dimensions</text>
<text x="655" y="162" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">goal alignment · grounding</text>
<text x="655" y="182" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">actionability · rationale</text>
<text x="655" y="202" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">feed-forward · framing</text>
<text x="655" y="222" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">learner agency · reference alignment</text>
<text x="655" y="244" text-anchor="middle" font-family="Arial" font-size="12" fill="#7a8794">scored or not_evaluable</text>

<line x1="778" y1="185" x2="812" y2="185" stroke="#8391a1" stroke-width="2"/>
<path d="M804 179 L812 185 L804 191" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="820" y="125" width="160" height="120" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="900" y="154" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Review flags</text>
<text x="900" y="180" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">generic · vague</text>
<text x="900" y="200" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">mismatch · certainty</text>
<text x="900" y="220" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">targeted suggestions</text>

<line x1="988" y1="185" x2="1022" y2="185" stroke="#8391a1" stroke-width="2"/>
<path d="M1014 179 L1022 185 L1014 191" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="1030" y="125" width="130" height="120" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="1095" y="154" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Validation</text>
<text x="1095" y="180" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">human ratings</text>
<text x="1095" y="200" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">weighted kappa</text>
<text x="1095" y="220" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">error analysis</text>

<text x="50" y="300" font-family="Arial" font-size="13" fill="#59636e">Reference correctness is never inferred from fluent wording; it is only scored when external reference evidence is supplied.</text>
</svg>