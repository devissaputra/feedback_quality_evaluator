<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Feedback Quality Evaluator synthetic demo</title>
<desc id="desc">Twenty synthetic feedback cases stress-test short precise feedback, verbose vague feedback, generic praise, unsupported certainty, rubric mismatch, reference contradiction, and human-rating comparison.</desc>
<rect width="1200" height="360" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic formative-feedback stress test</text>
<text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb8c5">20 contextual cases · two synthetic raters · no real learner data.</text>

<rect x="52" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Specificity stress test</text>
<text x="70" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">short precise vs long vague</text>
<text x="70" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">word count is not the score</text>

<rect x="320" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="338" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Evidence boundary</text>
<text x="338" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">supported · contradicted</text>
<text x="338" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">or not evaluable</text>

<rect x="588" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="606" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Error taxonomy</text>
<text x="606" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">generic · vague · mismatch</text>
<text x="606" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">certainty · person judgment</text>

<rect x="856" y="112" width="292" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="874" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Human validation path</text>
<text x="874" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">dimension-level ratings</text>
<text x="874" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">agreement · weighted kappa · MAE</text>

<text x="52" y="282" font-family="Arial" font-size="14" fill="#d1d5db">The demo prints dimension scores, not-evaluable states, review flags, and revision suggestions for every case.</text>
<text x="52" y="309" font-family="Arial" font-size="14" fill="#d1d5db">Synthetic rater metrics validate the software path only; they are not empirical reliability results.</text>
<text x="52" y="337" font-family="Arial" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py</text>
</svg>